name: Local PDF MCP CI

on:
  pull_request:
  push:

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [24]
    defaults:
      run:
        working-directory: Local-pdf-mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: Local-pdf-mcp-server/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Node dependencies
        run: npm ci
      - name: Install optional Python worker dependencies
        run: python -m pip install -r requirements.txt
      - name: Static architecture and MCP startup checks
        run: npm run health
      - name: Unit, malformed-artifact, cancellation, and recovery checks
        run: npm run test:unit
      - name: Python worker checks
        run: npm run test:python
      - name: Semantic golden regression gate
        run: npm run test:semantic
      - name: Existing evaluation/profile/golden checks
        run: npm run test:eval && npm run test:profiles && npm run test:golden
